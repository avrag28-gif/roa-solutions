name: Deploy ROA Solutions to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch supplied ROA assets
        run: |
          set -euo pipefail
          mkdir -p public/resources
          base="https://roa-solutions-oyhm3m.v2.appdeploy.ai/resources"
          curl -fL --retry 3 "$base/roa_wordmark_dark_mode.png" -o public/resources/roa_wordmark_dark_mode.png
          curl -fL --retry 3 "$base/roa_solutions_primary_lockup_light.png" -o public/resources/roa_solutions_primary_lockup_light.png
          curl -fL --retry 3 "$base/live-app-canvas-detail-2026-07-30.webp" -o public/resources/live-app-canvas-detail-2026-07-30.webp
          curl -fL --retry 3 "$base/live-app-crop-share-conference-2026-07-30.webp" -o public/resources/live-app-crop-share-conference-2026-07-30.webp
          curl -fL --retry 3 "$base/live-app-presenting-roa-deck-2026-07-30.webp" -o public/resources/live-app-presenting-roa-deck-2026-07-30.webp
          curl -fL --retry 3 "$base/live-app-canvas-brandline-deck-2026-07-30.webp" -o public/resources/live-app-canvas-brandline-deck-2026-07-30.webp
          curl -fL --retry 3 "$base/live-app-service-orders-2026-07-30.webp" -o public/resources/live-app-service-orders-2026-07-30.webp
      - run: npm install
      - run: BASE_PATH=/roa-solutions/ npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
